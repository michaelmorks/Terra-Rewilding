<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra Rewilding — Ecological Design & Rewilding</title>
  <meta name="description" content="Terra Rewilding — uniting nature and society through ecological design, rewilding, and sustainable environments.">
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="fav/favicon.ico" type="image/x-icon">

</head>

<body>

<!-- STARFIELD CANVAS -->
<canvas id="starfield"></canvas>

<!-- HERO -->
<div class="hero" id="hero">

  <!-- MOBILE IMAGE (phones only) -->
  <img
    src="herophotos/hero-mobile.png"
    alt="Terra Rewilding landscape"
    class="hero-image"
  />

  <!-- DESKTOP VIDEO -->
  <video
    class="hero-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="videos/hero.mp4" type="video/mp4">
  </video>

  <div class="hero-content">
    <h1>
      <span class="terra">TERRA</span><br>
      <span class="rewilding">REWILDING</span>
    </h1>

    <button
      class="enter-btn"
      onclick="enterSite()"
      aria-label="Enter Terra Rewilding website"
    >
      Enter Terra Rewilding
    </button>
  </div>
</div>

<!-- MESSAGE SCREEN -->
<div id="messageScreen" aria-hidden="true" hidden>
  <span><strong> Your Journey To Reconnect Nature With Society Begins</strong></span>
</div>


<!-- MAIN SCRIPT -->
<script>
  function enterSite() {
    const hero = document.getElementById("hero");
    const msg = document.getElementById("messageScreen");
    const btn = document.querySelector(".enter-btn");

    // Prevent double-tap
    btn.disabled = true;
    btn.style.pointerEvents = "none";

    /* STEP 5 — redirect */
    setTimeout(() => {
      window.location.href = "main.html";
    });
  }
</script>

<!-- DESKTOP AUTOPLAY SAFETY -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const video = document.querySelector(".hero-video");
    if (video && window.innerWidth > 768) {
      video.muted = true;
      video.play().catch(() => {});
    }
  });
</script>

</body>
</html>
