<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra Rewilding — Ecological Design & Rewilding</title>
  <meta name="description" content="Terra Rewilding — uniting nature and society through ecological design, rewilding, and sustainable environments.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- STARFIELD CANVAS -->
<canvas id="starfield"></canvas>

<!-- HERO -->
<div class="hero" id="hero">

  <!-- MOBILE IMAGE (phones only) -->
  <img
    src="herophotos/hero-mobile.png"
    alt="Terra Rewilding landscape"
    class="hero-image"
  />

  <!-- DESKTOP VIDEO -->
  <video
    class="hero-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="videos/hero.mp4" type="video/mp4">
  </video>

  <div class="hero-content">
    <h1>
      <span class="terra">TERRA</span><br>
      <span class="rewilding">REWILDING</span>
    </h1>

    <button
      class="enter-btn"
      onclick="enterSite()"
      aria-label="Enter Terra Rewilding website"
    >
      Enter Terra Rewilding
    </button>
  </div>
</div>

<!-- MESSAGE SCREEN -->
<div id="messageScreen" aria-hidden="true">
  <span><strong> Your Journey To Reconnect Nature And Society Begins</strong></span>
</div>

<!-- MAIN SCRIPT -->
<script>
  function enterSite() {
    const hero = document.getElementById("hero");
    const msg = document.getElementById("messageScreen");
    const btn = document.querySelector(".enter-btn");

    // Prevent double-tap
    btn.disabled = true;
    btn.style.pointerEvents = "none";

    /* STEP 1 — fade hero */
    hero.style.transition = "opacity 2s ease";
    hero.style.opacity = "0";

   /* STEP 2 — stars */
setTimeout(() => {
  const starImg = document.createElement("img");

  // Detect mobile vs desktop
  const isMobile = window.matchMedia("(max-width: 768px)").matches;

  starImg.src = isMobile
    ? "herophotos/iphone-stars.png"
    : "herophotos/hero-stars.png";

  starImg.alt = "Stars background";
  starImg.id = "starImage";

  Object.assign(starImg.style, {
    position: "fixed",
    inset: "0",
    width: "100%",
    height: "100%",
    objectFit: "cover",
    zIndex: "1",
    opacity: "0",
    transition: "opacity 1.5s ease"
  });

  document.body.appendChild(starImg);

  requestAnimationFrame(() => {
    starImg.style.opacity = "1";
  });

  /* STEP 3 — show message */
  const scale = Math.min(window.innerWidth / 600, 1.1);
  msg.classList.add("show");
msg.setAttribute("aria-hidden", "false");


}, 2000);

    /* STEP 4 — hide message smoothly */
    setTimeout(() => {
      msg.style.opacity = "0";
      msg.style.transform = "scale(0.4)";

      setTimeout(() => {
        msg.style.visibility = "hidden";
        msg.setAttribute("aria-hidden", "true");
      }, 4000);
    }, 6000);

    /* STEP 5 — redirect */
    setTimeout(() => {
      window.location.href = "main.html";
    }, 7000);
  }
</script>

<!-- DESKTOP AUTOPLAY SAFETY -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const video = document.querySelector(".hero-video");
    if (video && window.innerWidth > 768) {
      video.muted = true;
      video.play().catch(() => {});
    }
  });
</script>

</body>
</html>
