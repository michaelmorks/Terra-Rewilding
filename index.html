<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terra Rewilding — Ecological Design & Rewilding</title>
  <meta name="description" content="Terra Rewilding — uniting nature and society through ecological design, rewilding, and sustainable environments.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- STARFIELD CANVAS (kept for later use) -->
<canvas id="starfield"></canvas>

<!-- HERO -->
<div class="hero" id="hero">
  <video
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="videos/hero.mp4" type="video/mp4">
  </video>

  <div class="hero-content">
    <h1>
      <span class="terra">TERRA</span><br>
      <span class="rewilding">REWILDING</span>
    </h1>

    <button
      class="enter-btn"
      onclick="enterSite()"
      aria-label="Enter Terra Rewilding website"
    >
      Enter Terra Rewilding Website
    </button>
  </div>
</div>

<!-- MESSAGE SCREEN -->
<div id="messageScreen" aria-hidden="true">
  Your First Step in uniting nature and its beauty with our society.
</div>

<!-- MAIN SCRIPT -->
<script>
  function enterSite() {
    const hero = document.getElementById("hero");
    const msg = document.getElementById("messageScreen");
    const btn = document.querySelector(".enter-btn");

    // Prevent double-tap on mobile
    btn.disabled = true;
    btn.style.pointerEvents = "none";

    /* STEP 1 — fade hero to black */
    hero.style.transition = "opacity 2s ease";
    hero.style.opacity = "0";

    /* STEP 2 — show stars after fade */
    setTimeout(() => {
      const starImg = document.createElement("img");
      starImg.src = "herophotos/hero-stars.jpg";
      starImg.alt = "Stars background";
      starImg.id = "starImage";

      Object.assign(starImg.style, {
        position: "fixed",
        inset: "0",
        width: "100%",
        height: "100%",
        objectFit: "cover",
        zIndex: "1",
        opacity: "0",
        transition: "opacity 1.5s ease"
      });

      document.body.appendChild(starImg);

      requestAnimationFrame(() => {
        starImg.style.opacity = "1";
      });

      /* STEP 3 — show message */
      const scale = Math.min(window.innerWidth / 600, 1.1);
      msg.style.visibility = "visible";
      msg.style.opacity = "1";
      msg.style.transform = `scale(${scale})`;
      msg.setAttribute("aria-hidden", "false");

    }, 2000);

/* STEP 4 — hide message smoothly */
setTimeout(() => {
  msg.style.opacity = "0";
  msg.style.transform = "scale(0.4)";

  // wait for transition to finish before hiding
  setTimeout(() => {
    msg.style.visibility = "hidden";
    msg.setAttribute("aria-hidden", "true");
  }, 4000); // MUST match CSS transition duration
}, 8000);


    /* STEP 5 — redirect */
    setTimeout(() => {
      window.location.href = "main.html";
    }, 9500);
  }
</script>

<!-- MOBILE AUTOPLAY SAFETY -->
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const video = document.querySelector(".hero video");
    if (video) {
      video.muted = true;
      video.play().catch(() => {});
    }
  });
</script>

</body>
</html>
